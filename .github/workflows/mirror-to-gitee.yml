# 把公开仓镜像到 Gitee(国内线路)。
#
# 为什么要它:raw.githubusercontent.com 在国内基本连不上,而 56 MB 的 APK
# 从家用宽带上行传 Gitee 要十分钟。放这里跑 = 机房对机房,本地什么都不用传。
#
# ⚠️ 它**不碰签名密钥**。APK 是在本机打包并签名、发到 GitHub Release 的,
#    这里只做「下载已签好的成品 → 上传」。keystore 一步都不用离开本机。
name: mirror-to-gitee

on:
  push:
    branches: [main]
    paths:
      # ⚠️ 通配写法是给**通道**留的:checkin.beta.js / manifest.beta.gitee.json 这些
      #    不用再回来改这个文件。稳定那两个也在这个模式里。
      - "checkin*.js"
      - "manifest*.json"
      - index.html
  release:
    types: [published]
  workflow_dispatch:

# ⚠️ 并发组必须带上事件名。踩过:发 0.1.7 时 push 和 release 同时触发,
#    同组里只能有一个 run 在排队,后到的 push 把**排队中的 release 挤掉了** ——
#    而 release 那次才是搬 APK 的,结果 APK 没上 Gitee,工作流还一片绿。
concurrency:
  group: mirror-to-gitee-${{ github.event_name }}
  cancel-in-progress: false

env:
  GITEE_OWNER: flyten1129
  GITEE_REPO: xiaogu-biaobai
  APK_NAME: xiaogu-biaobai.apk
  # ⚠️ 正式包的 Release 用**固定 tag `apk`**,不是版本号 tag,更不是 `latest`。
  #    `latest` 是 Gitee 对「最新那个 Release」的别名 —— 只要再发任何一个 Release
  #    (比如 beta),它就会指过去,正式下载链当场 404。2026-09-16 踩过,挂了 25 分钟。
  APK_TAG: apk

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 推文件到 Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GITEE_TOKEN" || { echo "没设 GITEE_TOKEN secret"; exit 1; }
          git clone -q --depth 1 -b master \
            "https://oauth2:${GITEE_TOKEN}@gitee.com/${GITEE_OWNER}/${GITEE_REPO}.git" gt
          cp index.html gt/
          # 每条通道一份脚本:checkin.js(稳定)、checkin.beta.js …… 全搬
          cp checkin*.js gt/
          # ⚠️ 镜像那份清单由 release.py 生成(地址常量只在那儿定义一次),
          #    这里只是改个名照抄,不做任何改写:
          #      manifest.gitee.json      → manifest.json
          #      manifest.beta.gitee.json → manifest.beta.json
          # ⚠️ 只搬 *.gitee.json,**别搬 GitHub 那份同名清单** —— 那份里的脚本地址
          #    指着 raw.githubusercontent,搬过去等于让国内用户从 GitHub 拉脚本。
          for f in manifest*.gitee.json; do
            [ -e "$f" ] || continue
            cp "$f" "gt/$(echo "$f" | sed 's/[.]gitee[.]json$/.json/')"
          done
          cd gt
          git config user.name  "小菇爱表白"
          git config user.email "noreply@xiaogu-biaobai.invalid"
          git add -A
          # ⚠️ 不能写成 `git diff --quiet && exit 0` —— 有改动时 diff 返回 1,
          #    在 set -e 下会把整步判成失败。用 if 才对。
          if git diff --cached --quiet; then
            echo "内容没变,跳过"
          else
            git commit -q -m "镜像 ${GITHUB_SHA:0:7}"
            # ⚠️ **必须重试。** release.py 一次发布会同时触发 push 和 release 两个 run,
            #    它们在不同的并发组(见文件头),所以是**并行**跑的 —— 两边同时往
            #    Gitee 推,后到的必被 `! [rejected] (fetch first)` 顶回来。
            #    2026-09-20 发 0.1.8 就这么挂的:release 那个 run 死在这儿,
            #    于是下面「搬 APK」被 skip,Gitee 上还挂着 0.1.7 —— 而清单已经
            #    写着 0.1.8 的哈希,谁点下载谁校验失败。是拿手工补传救回来的。
            for t in 1 2 3 4 5; do
              if git push -q origin master; then echo "已推(第 $t 次)"; break; fi
              echo "被顶回来了,拉一下再推(第 $t 次)"
              git pull -q --rebase origin master || git pull -q --no-rebase --no-edit origin master
              sleep $((t * 3))
            done
          fi

      - name: 把脚本搬成 Gitee Release 附件
        # ⚠️⚠️ **为什么脚本不走仓库文件:Gitee 按「内容」把它判违规了。**
        #    2026-10-24 实测:raw 取 checkin.js / checkin.beta.js 一律回
        #    `451 The content may contain violation information`。
        #    换文件名(app.js)、换扩展名(app.txt)**都一样 451** —— 认的是内容不是路径,
        #    同一份字节传上去当场就封;而同仓的 manifest.json / index.html 都是 200。
        #    Release 附件**不走那道扫描**(APK 一直好好的就是证据)。
        #    所以镜像清单里的「脚本.地址」指 Release 附件,见 release.py 的 镜像脚本地址。
        #
        # ⚠️⚠️ **必须 always()。** 这一步跟推文件是两件独立的事,而漏传是**静默故障**:
        #    清单已经写着新 sha256、附件还是旧的 → loader 校验不过 → 把脚本丢掉,
        #    一声不吭。跟 0.1.8 那次漏搬 APK 是同一种坑,所以回验必须**真判定**。
        #
        # ⚠️ **先删后传,顺序不能反。** 2026-10-24 实测:Gitee 允许同名附件并存,
        #    而 /releases/download/<tag>/<名> 服务的是**最先传的那一份** ——
        #    先传后删的话,中间这段时间固定链发的是旧脚本。
        # ⚠️⚠️ **release 事件不跑这一步。** checkin*.js 只会因为 push 而变,
        #    release 压根不碰它们;而 release 和 push 在**不同的并发组**(见文件头),
        #    是真并行的 —— 两边都「先删后传」同一个附件,就会互相删掉对方刚传的那份。
        #    2026-10-26 实测:release 那个 run 删了附件 3493607、传完 3 秒回验拿到 404,
        #    整个 run 变红 —— 而最终状态其实是对的。**红得没道理比坏更糟**:
        #    真坏那天就没人当回事了。跟雷②(推文件被并发顶掉)是同一种病。
        if: always() && github.event_name != 'release'
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          API="https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}"
          BAD=0

          move_one() {
            F="$1"; T="$2"
            if [ ! -f "$F" ]; then echo "── $F 不在仓里,跳过"; return 0; fi
            echo "── $F → tag=$T ──"
            SZ=$(stat -c%s "$F")
            SHA=$(sha256sum "$F" | cut -d' ' -f1)
            echo "   本地 ${SZ} 字节  sha256 ${SHA}"

            RID=$(curl -sS "${API}/releases?access_token=${GITEE_TOKEN}&per_page=100"                   | jq -r --arg t "$T" '.[] | select(.tag_name==$t) | .id' | head -1)
            # ⚠️ 脚本**不自己建 Release**:正式那个由下面「搬 APK」那步建/复用,
            #    而多建一个 Release 就会顶掉 Gitee 的 latest 别名(2026-09-16 踩过)。
            if [ -z "$RID" ] || [ "$RID" = "null" ]; then
              echo "   ❌ tag=$T 的 Release 不存在,脚本没地方挂"
              BAD=1; return 0
            fi

            for i in $(curl -sS "${API}/releases/${RID}/attach_files?access_token=${GITEE_TOKEN}"                        | jq -r --arg n "$F" '.[]? | select(.name==$n) | .id'); do
              curl -sS -X DELETE "${API}/releases/${RID}/attach_files/${i}?access_token=${GITEE_TOKEN}" >/dev/null || true
              echo "   删了同名旧附件 $i"
            done

            curl -sS -X POST "${API}/releases/${RID}/attach_files"               -F "access_token=${GITEE_TOKEN}" -F "file=@${F}" | jq -r '.name // .'

            # 回验固定直链:HTTP 200 **且 sha256 一致**才算数。
            # ⚠️ 传完之后那条固定直链要过几秒才解析得到,**3 秒不够**(2026-10-26 实测 404)。
            #    所以重试 5 次、越等越久;一直拿不到才算失败。
            U="https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}/releases/download/${T}/${F}"
            CODE=000; GSZ=0; GSHA="-"
            for w in 3 5 8 12 20; do
              sleep "$w"
              CODE=$(curl -sSL -o got.bin -w '%{http_code}' "$U" || echo 000)
              GSZ=$(stat -c%s got.bin 2>/dev/null || echo 0)
              GSHA=$(sha256sum got.bin 2>/dev/null | cut -d' ' -f1 || echo "-")
              rm -f got.bin
              if [ "$CODE" = "200" ] && [ "$GSHA" = "$SHA" ]; then break; fi
              echo "   (回验没过:HTTP ${CODE} ${GSZ} 字节,再等)"
            done
            if [ "$CODE" = "200" ] && [ "$GSHA" = "$SHA" ]; then
              echo "   ✅ $U  ${GSZ} 字节,sha256 一致"
            else
              echo "   ❌ 回验失败:HTTP ${CODE}  ${GSZ} 字节  sha256 ${GSHA}"
              BAD=1
            fi
          }

          move_one checkin.js      "${APK_TAG}"
          move_one checkin.beta.js beta

          test "$BAD" = "0" || { echo "附件没搬对 —— 清单可能指着旧脚本,不能当成功"; exit 1; }

      - name: 搬 APK 到 Gitee Release
        # ⚠️ `always() &&` 不能少。搬 APK 跟推文件是**两件独立的事**,
        #    不该因为前一步失败就整个跳过 —— 2026-09-20 正是这么漏的:
        #    推文件被并发顶回来 → 这一步 skipped → Gitee 上的包没换,
        #    而清单已经指向新版哈希,整条下载链当场对不上。
        if: always() && (github.event_name == 'release' || github.event_name == 'workflow_dispatch')
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          RELNAME: ${{ github.event.release.name }}
          RELBODY: ${{ github.event.release.body }}
        run: |
          set -euo pipefail
          API="https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}"

          # 手动触发时没有 release 上下文,自己去查最新那个
          if [ -z "${TAG:-}" ]; then
            J=$(curl -sS -H "Authorization: token ${GITHUB_TOKEN}"                 "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest")
            TAG=$(echo "$J" | jq -r '.tag_name')
            RELNAME=$(echo "$J" | jq -r '.name // .tag_name')
            RELBODY=$(echo "$J" | jq -r '.body // ""')
            echo "手动触发,用最新 Release:$TAG"
          fi

          # ⚠️⚠️ **通道包的 tag 和附件名跟正式不一样,这里必须认出来。**
          #      正式: tag v0.1.8        附件 xiaogu-biaobai.apk        Gitee tag=apk
          #      beta: tag v0.1.8-beta   附件 xiaogu-biaobai-beta.apk   Gitee tag=beta
          #    不认的话,这一步会拿 v0.1.8-beta 去下 xiaogu-biaobai.apk → 404 →
          #    `test SIZE -gt 1000000` 当场 exit 1,整个 run 变红,而通道包永远到不了 Gitee。
          #    (2026-10-26 补;同一天 release.py 的 发APK() 才改成 tag/附件名带通道。)
          # ⚠️ 手动触发那条走 `releases/latest`,而 GitHub 的 latest **跳过预发布**,
          #    通道包一律是预发布 —— 所以手动触发永远只搬正式包,这是对的,别「修」。
          CH=""
          case "$TAG" in *-*) CH="${TAG##*-}";; esac
          if [ -n "$CH" ]; then
            NAME="xiaogu-biaobai-${CH}.apk"; DEST_TAG="$CH"
            echo "通道包 $TAG → 附件 ${NAME} · Gitee tag=${DEST_TAG}"
          else
            NAME="${APK_NAME}"; DEST_TAG="${APK_TAG}"
            echo "正式包 $TAG → 附件 ${NAME} · Gitee tag=${DEST_TAG}"
          fi
          # 传给「回验」那步 —— 它是独立 step,读不到这里的局部变量
          { echo "NAME=${NAME}"; echo "DEST_TAG=${DEST_TAG}"; } >> "$GITHUB_ENV"

          # ⚠️ 必须下成**最终文件名**:Gitee 用上传时的文件名给附件命名。
          #    存成 apk.apk 的话 /releases/download/latest/<APK_NAME> 直接 404 ——
          #    而且 0.1.7 那次就这么发出去了,回验步骤还报了成功(见下)。
          echo "── 从 GitHub Release 取已签名的 APK ──"
          curl -sSL --retry 3 -o "${NAME}" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${NAME}"
          SIZE=$(stat -c%s "${NAME}")
          echo "大小 ${SIZE}  sha256 $(sha256sum "${NAME}" | cut -c1-16)…"
          # 下歪了(拿到 404 页面)就别往上传
          test "$SIZE" -gt 1000000 || { echo "下下来的东西太小,八成不是 APK"; exit 1; }

          # ⚠️ Gitee 侧**永远只有一个正式 Release**,tag 固定是 ${APK_TAG}(= apk),
          #    每发一版就换掉里面的附件、改一下标题 —— 下载链因此永不变。
          #    别再按 ${TAG}(v0.1.8 这种)建:那样每版一个 Release,
          #    而下载链只能靠 latest 别名去指「最新那个」,一发别的东西就被顶掉(踩过)。
          echo "── 找/建固定 tag(${DEST_TAG})的 Gitee Release ──"
          RID=$(curl -sS "${API}/releases?access_token=${GITEE_TOKEN}&per_page=100" \
                | jq -r --arg t "$DEST_TAG" '.[] | select(.tag_name==$t) | .id' | head -1)
          if [ -z "$RID" ]; then
            # ⚠️ 必须显式声明 charset=utf-8。不声明的话 Gitee 会按别的编码解,
            #    中文标题直接变乱码 —— 踩过。
            RID=$(curl -sS -X POST "${API}/releases" \
              -H "Content-Type: application/x-www-form-urlencoded; charset=utf-8" \
              --data-urlencode "access_token=${GITEE_TOKEN}" \
              --data-urlencode "tag_name=${DEST_TAG}" \
              --data-urlencode "name=${RELNAME}" \
              --data-urlencode "body=${RELBODY}" \
              --data-urlencode "target_commitish=master" | jq -r '.id')
            echo "新建了 $RID"
          else
            echo "复用已有的 $RID,把标题和说明改成这一版的"
            curl -sS -X PATCH "${API}/releases/${RID}" \
              -H "Content-Type: application/x-www-form-urlencoded; charset=utf-8" \
              --data-urlencode "access_token=${GITEE_TOKEN}" \
              --data-urlencode "tag_name=${DEST_TAG}" \
              --data-urlencode "name=${RELNAME}" \
              --data-urlencode "body=${RELBODY}" >/dev/null || echo "(改标题失败,不致命)"
          fi
          test -n "$RID" -a "$RID" != "null" || { echo "拿不到 release id"; exit 1; }

          echo "── 同名旧附件先删掉,免得一版挂两份 56MB ──"
          for i in $(curl -sS "${API}/releases/${RID}/attach_files?access_token=${GITEE_TOKEN}" \
                     | jq -r --arg n "$NAME" '.[]? | select(.name==$n) | .id'); do
            curl -sS -X DELETE "${API}/releases/${RID}/attach_files/${i}?access_token=${GITEE_TOKEN}" >/dev/null || true
            echo "删了旧附件 $i"
          done

          echo "SIZE_KEEP=${SIZE}" >> "$GITHUB_ENV"

          echo "── 上传 ──"
          curl -sS -X POST "${API}/releases/${RID}/attach_files" \
            -F "access_token=${GITEE_TOKEN}" -F "file=@${NAME}" \
            | jq -r '.browser_download_url // .'

      - name: 回验固定直链
        if: always() && (github.event_name == 'release' || github.event_name == 'workflow_dispatch')
        run: |
          set -euo pipefail
          # 上一步把通道算好写进了 GITHUB_ENV;没跑到那儿就退回正式那套
          DEST_TAG="${DEST_TAG:-$APK_TAG}"; NAME="${NAME:-$APK_NAME}"
          U="https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}/releases/download/${DEST_TAG}/${NAME}"
          # ⚠️ 段序跟 GitHub 相反:GitHub 是 /releases/<tag>/download/<文件名>,
          #    Gitee 是 /releases/download/<tag>/<文件名>。
          # ⚠️ 这里**必须是固定 tag**,不能写 latest —— latest 是「最新那个 Release」的
          #    别名,拿它回验的话,哪天别的 Release 更新,验的就不是这一份了。
          echo "$U"
          # ⚠️ 必须**判定**。上一版只 echo 状态码,结果附件名错了、链接 404,
          #    工作流照样一片绿 —— 等于没验。
          CODE=$(curl -sI -L --max-time 120 -o /dev/null -w "%{http_code}" "$U")
          echo "HTTP ${CODE}"
          test "$CODE" = "200" || { echo "固定直链拿不到 200"; exit 1; }
          curl -sL --max-time 300 -o v.bin "$U"
          VS=$(stat -c%s v.bin)
          echo "回验下到 ${VS} 字节,头两字节 $(head -c2 v.bin | xxd -p)"
          test "$VS" = "$SIZE_KEEP" || { echo "大小跟刚传的对不上(${SIZE_KEEP})"; exit 1; }
